# Synthetic messages for measuring what a PII scrubber finds (chunk 3, slice 0). Every person,
# number and address here is invented: surnames that don't exist, phone numbers from the ranges set
# aside for fiction (UK 07700 900xxx, US 555-01xx), emails at example domains, the IBAN registry's
# own example. Town and company names are real or generic; they are not anyone's personal data.
#
# Each case is a message and the spans a scrubber should find, by kind and exact text (the first
# occurrence, unless `nth` says otherwise; counting from 1). Kinds:
#   person        a private person's name, whole or part ("Imogen", "Mr Quillsby")
#   public        a public figure's name; scored apart (scrubbing it costs answer quality)
#   place         a town, city, region or venue tied to the writer
#   address       a street address or postcode
#   organisation  an employer, school, clinic, club tied to the writer
#   date          a specific calendar date (not "next week")
#   email, phone  contact details
#   id            account, IBAN, passport, patient, membership and similar numbers
#   relationship  a phrase linking someone to the writer ("my wife", "our landlord")
# Cases with no spans are clean: anything found there counts against precision.

# --- People -------------------------------------------------------------------------------------

