# Credentials (ADR 0009): stripped and sent where strip-and-send is on, otherwise kept home.

today = 2026-11-15

[[scenario]]
name = "with strip-and-send on, credentials are replaced and the rest leaves"
edition = "casual"
request = { sensitivity = "public", complexity = "hard", credentials = true }
expect = { outcome = "route", account = "provider-b", column = "top", mechanisms = ["strip-credentials"], reasons = ["replaced by placeholders"] }

[[scenario]]
name = "personal work with credentials is scrubbed and stripped"
edition = "casual"
request = { sensitivity = "personal", complexity = "hard", credentials = true }
expect = { outcome = "route", account = "provider-a", mechanisms = ["restore", "scrub", "strip-credentials", "topic-pinning"] }

[[scenario]]
name = "credentials answered at home need no stripping"
edition = "casual"
request = { sensitivity = "public", complexity = "easy", credentials = true }
expect = { outcome = "route", account = "local", mechanisms = [] }

[[scenario]]
name = "where the admin forbids strip-and-send, credentials keep a request home"
edition = "corporate"
request = { sensitivity = "public", complexity = "hard", credentials = true }
expect = { outcome = "ask", question = "settle-local", account = "local", reasons = ["contains credentials and strip-and-send is off"] }

[[scenario]]
name = "with strip-and-send off, credentials stay home"
edition = "paranoid"
request = { sensitivity = "public", complexity = "easy", credentials = true }
expect = { outcome = "route", account = "local", reasons = ["contains credentials"] }

[[scenario]]
name = "secret work with credentials asks to settle locally"
edition = "casual"
request = { sensitivity = "secret", complexity = "hard", credentials = true }
expect = { outcome = "ask", question = "settle-local" }

[[scenario]]
name = "with no local model and strip-and-send off, credentials are refused"
edition = "gateway-only"
request = { sensitivity = "public", complexity = "easy", credentials = true }
expect = { outcome = "refuse", reasons = ["contains credentials", "no local model to settle for"] }
