# Corporate edition. No user.toml: staff run on the admin's values.

installed = [
    # Required
    "decision-engine", "outbound-check", "shutters", "policy", "credential-scanner",
    # Optional
    "pii-scrubber", "classifier", "local-runner", "provider-adapters", "terms-register",
    "exposure-ledger", "canaries", "answer-check",
]

# What the scrubber can find: patterns (counts as none), entities or context (needs the local runner).
pii_scrubber_grade = "context"
